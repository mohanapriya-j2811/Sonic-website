<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign Up | Sonic</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="signup">
  <div id="header"></div>
  <main class="wrap">
    <form class="form" data-form data-msg="Account created! Please login ✅" data-go="login.html">
      <h1>Create Account</h1>
      <label>Name<input name="name" type="text" placeholder="Your name"><small class="err"></small></label>
      <label>Email<input name="email" type="email" placeholder="you@example.com"><small class="err"></small></label>
      <label>Password<input name="password" type="password" placeholder="Min 8 chars, letter + number"><small class="err"></small></label>
      <label>Confirm Password<input name="confirm" type="password" placeholder="Repeat password"><small class="err"></small></label>
      <button class="btn">Sign Up</button>
      <p class="muted">Already have an account? <a href="login.html" style="color:var(--brand)">Login</a></p>
    </form>
  </main>
  <div id="footer"></div>
  <div id="toasts"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
