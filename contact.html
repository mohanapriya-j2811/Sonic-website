<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact | Sonic</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
  <div id="header"></div>
  <main class="wrap">
    <form class="form" data-form data-msg="Message sent! We'll reply soon 📩">
      <h1>Contact Us</h1>
      <label>Name<input name="name" type="text" placeholder="Your name"><small class="err"></small></label>
      <label>Email<input name="email" type="email" placeholder="you@example.com"><small class="err"></small></label>
      <label>Message<textarea name="message" rows="4" placeholder="How can we help?"></textarea><small class="err"></small></label>
      <button class="btn">Send Message</button>
    </form>
  </main>
  <div id="footer"></div>
  <div id="toasts"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
